<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Sapphire Metallic Gradient -->
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5583CF"/>
      <stop offset="22%" stop-color="#2D5CAB"/>
      <stop offset="50%" stop-color="#193B7D"/>
      <stop offset="78%" stop-color="#2C5CA8"/>
      <stop offset="100%" stop-color="#0E2352"/>
    </linearGradient>

    <linearGradient id="lightBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB4F5"/>
      <stop offset="30%" stop-color="#4673CD"/>
      <stop offset="70%" stop-color="#1E438A"/>
      <stop offset="100%" stop-color="#0E2350"/>
    </linearGradient>

    <linearGradient id="deepBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#315EA9"/>
      <stop offset="50%" stop-color="#142F69"/>
      <stop offset="100%" stop-color="#081636"/>
    </linearGradient>

    <!-- Chrome Edge Outline -->
    <linearGradient id="chromeOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#D2E0F2"/>
      <stop offset="42%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#7B93B2"/>
      <stop offset="85%" stop-color="#D9E4F5"/>
      <stop offset="100%" stop-color="#465A78"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02091A" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g transform="translate(56, 40) scale(2)" filter="url(#logoShadow)">
    <!-- LEFT SIDE OF U EMBLEM -->
    <!-- Outer Wing -->
    <path d="M 22,25 
             L 34,15 
             L 34,55 
             L 50,75 
             L 50,42 
             L 60,30 
             L 60,88 
             L 34,58 
             L 34,135 
             C 34,185 65,212 94,212 
             L 94,198 
             C 72,198 48,175 48,135 
             L 48,65 
             L 22,35 Z" 
          fill="url(#mainBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Outer Branch Accent Left -->
    <path d="M 22,25 
             L 45,60 
             L 35,68 
             L 22,50 Z" 
          fill="url(#lightBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.4" 
          stroke-linejoin="round"/>

    <!-- Middle Track Left -->
    <path d="M 50,75 
             L 64,62 
             L 64,135 
             C 64,165 80,186 94,186 
             L 94,172 
             C 85,172 76,155 76,135 
             L 76,85 
             L 50,75 Z" 
          fill="url(#deepBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Inner Track Left -->
    <path d="M 68,96 
             L 80,82 
             L 80,135 
             C 80,148 86,160 94,160 
             L 94,148 
             C 90,148 88,142 88,135 
             L 88,102 
             L 68,96 Z" 
          fill="url(#lightBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- RIGHT SIDE OF U EMBLEM -->
    <!-- Outer Wing Right -->
    <path d="M 178,25 
             L 166,15 
             L 166,55 
             L 150,75 
             L 150,42 
             L 140,30 
             L 140,88 
             L 166,58 
             L 166,135 
             C 166,185 135,212 106,212 
             L 106,198 
             C 128,198 152,175 152,135 
             L 152,65 
             L 178,35 Z" 
          fill="url(#mainBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Outer Branch Accent Right -->
    <path d="M 178,25 
             L 155,60 
             L 165,68 
             L 178,50 Z" 
          fill="url(#lightBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.4" 
          stroke-linejoin="round"/>

    <!-- Middle Track Right -->
    <path d="M 150,75 
             L 136,62 
             L 136,135 
             C 136,165 120,186 106,186 
             L 106,172 
             C 115,172 124,155 124,135 
             L 124,85 
             L 150,75 Z" 
          fill="url(#deepBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Inner Track Right -->
    <path d="M 132,96 
             L 120,82 
             L 120,135 
             C 120,148 114,160 106,160 
             L 106,148 
             C 110,148 112,142 112,135 
             L 112,102 
             L 132,96 Z" 
          fill="url(#lightBlue)" 
          stroke="url(#chromeOutline)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Specular Highlights -->
    <path d="M 33,35 L 33,135 C 33,180 62,206 94,207" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.9" fill="none"/>
    <path d="M 167,35 L 167,135 C 167,180 138,206 106,207" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.9" fill="none"/>
    <path d="M 63,70 L 63,135 C 63,162 78,181 94,182" stroke="#FFFFFF" stroke-width="1.1" stroke-opacity="0.75" fill="none"/>
    <path d="M 137,70 L 137,135 C 137,162 122,181 106,182" stroke="#FFFFFF" stroke-width="1.1" stroke-opacity="0.75" fill="none"/>
  </g>
</svg>